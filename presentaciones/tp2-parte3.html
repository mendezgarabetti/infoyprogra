## Función vs. procedimiento vs. prototipo

- **Función**: subrutina que devuelve un valor con `return`.
- **Procedimiento**: subrutina `void`, no devuelve nada (pero puede
  modificar sus parámetros si los recibe por puntero).
- **Prototipo**: la firma de la función declarada **antes** de usarla,
  para que el compilador sepa qué esperar.

```c
// Prototipo (arriba del archivo, o en un .h)
int es_bisiesto(int anio);

// Implementación (más abajo, o en el .c)
int es_bisiesto(int anio) {
    return (anio % 4 == 0 && anio % 100 != 0) || (anio % 400 == 0);
}
```

## 1. Fechas con validación

Cuatro funciones que se apoyan entre sí:

```c
int es_bisiesto(int anio);
int dias_del_mes(int mes, int anio);
void fecha_anterior(int dia, int mes, int anio, int *d, int *m, int *a);
void fecha_posterior(int dia, int mes, int anio, int *d, int *m, int *a);
int dias_restantes_mes(int dia, int mes, int anio);
```

`fecha_anterior`/`fecha_posterior` son `void`: el resultado **no** se
devuelve con `return`, se escribe en las direcciones que apuntan
`d`, `m`, `a`.

--

## Punteros de salida: el patrón

```c
void fecha_posterior(int dia, int mes, int anio,
                      int *d, int *m, int *a) {
    // ... calcular el día siguiente ...
    *d = diaCalculado;
    *m = mesCalculado;
    *a = anioCalculado;
}

// en el llamador:
int d, m, a;
fecha_posterior(31, 12, 2025, &d, &m, &a);
```

Es la única forma de que una función `void` "devuelva" más de un
valor al mismo tiempo.

## ⚠️ Cuidado: los bordes del calendario

Regla de bisiesto **exacta**: divisible por 4 **y** (no divisible por
100 **o** divisible por 400) — 2000 es bisiesto, 1900 no.

<div class="caution">

**Casos que rompen implementaciones ingenuas:**
- `31/12 → 01/01` (cambia mes **y** año)
- `31/01 → 01/02` (cambia mes)
- Febrero: 28 o 29 según `es_bisiesto()`, no un número fijo

Si `dia == dias_del_mes(mes, anio)`, el día siguiente es `1` del
**próximo** mes (y si `mes == 12`, próximo año).

</div>

## 2. Decimal a binario

Algoritmo de **división sucesiva por 2**: el residuo de cada división
es un dígito binario, generado de derecha a izquierda.

```c
25 / 2 = 12 resto 1   →  bit menos significativo
12 / 2 = 6  resto 0
 6 / 2 = 3  resto 0
 3 / 2 = 1  resto 1
 1 / 2 = 0  resto 1   →  bit más significativo
```

Resultado leído de abajo hacia arriba: `11001`.

--

## ⚠️ Cuidado: el orden sale invertido

Los restos se generan del bit **menos** significativo al **más**
significativo — el orden contrario al que hay que imprimir.

```c
void decimal_a_binario(int decimal) {
    char bits[32];
    int i = 0;
    do {
        bits[i++] = (decimal % 2) + '0';   // guardar, no imprimir
        decimal /= 2;
    } while (decimal > 0);

    while (i > 0) putchar(bits[--i]);      // imprimir al revés
}
```

<p class="small">Alternativa: hacerlo con <code>mostrar_binario_recursivo()</code> —
la recursión invierte el orden gratis, porque el <code>printf</code> del dígito
va <b>después</b> de la llamada recursiva.</p>

## 3. Tabla de valores de un polinomio

`p(x) = a·x² + b·x + c`

Tres funciones separadas por responsabilidad:

```c
double evaluar_polinomio(double a, double b, double c, double x);
void tabla_valores(double a, double b, double c,
                    double x1, double x2, double delta);
void mostrar_encabezado(void);
```

`tabla_valores` recorre `[x1, x2]` en pasos de `delta` y llama a
`evaluar_polinomio` en cada punto.

--

## ⚠️ Cuidado: acumular error sumando `delta`

```c
// riesgoso: el error de redondeo se acumula en cada suma
for (double x = x1; x <= x2; x += delta) { ... }

// más robusto: recalcular x desde el índice
int n = (int)((x2 - x1) / delta);
for (int i = 0; i <= n; i++) {
    double x = x1 + i * delta;
    ...
}
```

<p class="small">Con muchas iteraciones, sumar <code>delta</code> repetidamente puede
hacer que el bucle nunca llegue exactamente a <code>x2</code>, o se pase.</p>

## 4. MCD recursivo (Euclides)

| Caso | Definición |
|---|---|
| Base (`b = 0`) | `gcd(a, b) = a` |
| Recursivo (`b ≠ 0`) | `gcd(a, b) = gcd(b, a mod b)` |

```c
int mcd_recursivo(int a, int b) {
    if (b == 0) {
        return a;                    // caso base
    }
    return mcd_recursivo(b, a % b);  // caso recursivo
}
```

--

## Traza de ejecución

```
gcd(48, 18) = gcd(18, 48 mod 18) = gcd(18, 12)
            = gcd(12, 18 mod 12) = gcd(12, 6)
            = gcd(6,  12 mod 6)  = gcd(6, 0)
            = 6
```

Cada llamada reduce el problema (el segundo argumento decrece) hasta
llegar al caso base — la garantía de que la recursión termina.

---

## 5. Factorial recursivo

| Caso | Definición |
|---|---|
| Base (`n = 0` o `n = 1`) | `n! = 1` |
| Recursivo (`n > 1`) | `n! = n × (n-1)!` |

```c
long long factorial_recursivo(int n) {
    if (n == 0 || n == 1) return 1;      // caso base
    return n * factorial_recursivo(n - 1); // caso recursivo
}
```

Funciones auxiliares pedidas: `validar_entrada(n)` (¿`n >= 0`?) y
`mostrar_calculo(n)` para exhibir el proceso.

--

## ⚠️ Cuidado: overflow

`13! > 6 × 10⁹` — ya no entra en un `int` de 32 bits (máximo
~2.1 × 10⁹). Por eso la firma pide `long long`.

```c
int  malo;       // se desborda desde 13!
long long bien;  // sirve hasta 20! aprox.
```

<p class="small">Validar <code>n &gt;= 0</code> <b>antes</b> de llamar a la recursión —
factorial de un negativo nunca llega al caso base y recursa para siempre.</p>

## 6. Palíndromo recursivo

Firma: `int es_palindromo_recursivo(char str[], int inicio, int fin)`
— compara extremos y avanza hacia el centro.

```c
int es_palindromo_recursivo(char str[], int inicio, int fin) {
    if (inicio >= fin) return 1;             // caso base: se cruzaron
    if (str[inicio] != str[fin]) return 0;   // caso base: no matchea
    return es_palindromo_recursivo(str, inicio + 1, fin - 1); // recursivo
}
```

--

## Antes de comparar: normalizar

<div class="caution">

**⚠️ Cuidado:** `"Anita lava la tina"` es palíndromo solo si antes se
**normaliza** el texto — sacar espacios y pasar a minúsculas — porque
la función compara carácter a carácter, y `'A' != 'a'`, `' ' != 'l'`.

</div>

```c
void convertir_minusculas(char str[]);
void limpiar_espacios(char str[]);   // opcional, según el caso de prueba
```

Preparar la cadena con estas dos funciones **antes** de llamar a
`es_palindromo_recursivo`.
